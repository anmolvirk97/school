<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Records</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>

<section id="login" class="login"><div class="card">
 <h1>School Records</h1><p class="sub">Enter your username and PIN</p>
 <input id="user" placeholder="Username" autocomplete="username">
 <div class="dots" id="dots"></div><div class="err" id="err"></div>
 <div class="pad" id="pad"></div></div></section>

<div id="app" class="app hide">
 <nav><button class="on" data-v="home" aria-label="Home">📊</button><button data-v="marks" aria-label="Test marks">📝</button><button data-v="out" aria-label="Log out">⎋</button></nav>
 <main>
  <div id="home">
   <h1>Hello, <span id="who"></span></h1><p class="sub" id="date"></p>
   <div class="stats" id="stats"></div>
   <div class="card"><b>Today</b><p class="sub" id="todo">No entries yet. Start with test marks.</p>
    <button class="btn" onclick="show('marks')">Enter test marks</button></div>
  </div>
  <div id="marks" class="hide">
   <h1>Test marks</h1><p class="sub">Set the test once, then tap names to enter marks.</p>
   <div class="card"><div class="row">
    <select id="cls"></select><select id="sub"></select><input id="tname" placeholder="Test name (e.g. Unit 1)">
    <input id="max" type="number" inputmode="numeric" placeholder="Max marks"><input id="tdate" type="date"></div>
    <p></p><button class="btn" id="go">Start entry</button></div>
   <div id="entry" class="hide">
    <div class="card"><div class="row" style="justify-content:space-between"><b id="cnt"></b><input id="find" placeholder="Search name" style="max-width:220px"></div>
     <div class="bar" style="margin-top:10px"><i id="prog"></i></div>
     <div class="alpha" id="alpha"></div><div id="list"></div></div></div>
  </div>
 </main></div>
<div id="sheet" class="sheet hide"></div>

<script src="app.js"></script></body></html>
